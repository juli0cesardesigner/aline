<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instagram Carousel Mockup</title>
  <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css"/>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <!-- Header estilo Instagram -->
  <header class="insta-header">
    <div class="left">
      <i class="ph ph-arrow-left"></i>
      <span>Explorar</span>
    </div>
    <div class="right">
      <button class="follow-btn">Seguir</button>
      <i class="ph ph-dots-three-outline-vertical"></i>
    </div>
  </header>

  <!-- Carrossel -->
  <main class="carousel-container">
    <div class="swiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img src="media/001.png" alt="001.png" />
        </div>
        <div class="swiper-slide">
          <video autoplay muted playsinline preload="metadata">
            <source src="media/002.mp4" type="video/mp4" />
          </video>
        </div>
        <div class="swiper-slide">
          <video autoplay muted playsinline preload="metadata">
            <source src="media/003.mp4" type="video/mp4" />
          </video>
        </div>
        <div class="swiper-slide">
          <img src="media/004.png" alt="004.png" />
        </div>
        <div class="swiper-slide">
          <img src="media/005.png" alt="005.png" />
        </div>
        <div class="swiper-slide">
          <video autoplay muted playsinline preload="metadata">
            <source src="media/006.mp4" type="video/mp4" />
          </video>
        </div>
        <div class="swiper-slide">
          <video autoplay muted playsinline preload="metadata">
            <source src="media/007.mp4" type="video/mp4" />
          </video>
        </div>
        <div class="swiper-slide">
          <img src="media/008.png" alt="008.png" />
        </div>
        <div class="swiper-slide">
          <img src="media/009.png" alt="009.png" />
        </div>
        <div class="swiper-slide">
          <img src="media/010.png" alt="010.png" />
        </div>
      </div>
      <div class="swiper-pagination"></div>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="insta-footer">
    <div class="actions">
      <i class="ph ph-heart"></i>
      <i class="ph ph-chat-circle"></i>
      <i class="ph ph-paper-plane-right"></i>
      <div class="dot-indicators"></div>
      <i class="ph ph-bookmark-simple"></i>
    </div>

    <nav class="insta-nav">
      <i class="ph ph-house"></i>
      <i class="ph ph-magnifying-glass"></i>
      <i class="ph ph-plus-square"></i>
      <i class="ph ph-video-camera"></i>
      <i class="ph ph-user-circle"></i>
    </nav>
  </footer>

  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
